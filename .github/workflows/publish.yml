name: Publish to npm

on:
  push:
    tags:
      - 'v*.*.*'  # Publish on version tags like v1.0.0

permissions:
  id-token: write
  contents: read

jobs:
  publish:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '24.x'

      - name: Set up Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: '1.x'

      - name: Install dependencies
        run: bun install

      - name: Build the package
        run: bun run build

      - name: Publish to npm
        run: |
          cd dist
          npm publish --provenance --access public
